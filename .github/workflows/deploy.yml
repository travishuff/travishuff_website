name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via rsync
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: ./
          remote_path: /home/travis8/public_html/
          remote_host: travishuff.com
          remote_user: travis8
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}